<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Редактор источников Осетии</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; background: #1a1a2e; color: #e0e0e0; }

  #sidebar { width: 340px; min-width: 340px; display: flex; flex-direction: column; background: #16213e; border-right: 1px solid #0f3460; }

  #sidebar-header { padding: 14px 16px; background: #0f3460; border-bottom: 1px solid #1a4a8a; }
  #sidebar-header h1 { font-size: 15px; font-weight: 700; color: #7ec8e3; margin-bottom: 4px; }
  #sidebar-header p { font-size: 11px; color: #8a9bb0; }

  #legend { display: flex; gap: 12px; padding: 8px 12px; background: #0a1a30; border-bottom: 1px solid #0f3460; font-size: 11px; }
  .leg { display: flex; align-items: center; gap: 5px; }
  .leg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .leg-red { background: #e74c3c; }
  .leg-blue { background: #0891b2; }
  .leg-label { color: #8a9bb0; }

  #search-box { padding: 8px 12px; border-bottom: 1px solid #0f3460; }
  #search-input { width: 100%; padding: 7px 10px; border-radius: 6px; background: #0f3460; border: 1px solid #1a4a8a; color: #e0e0e0; font-size: 13px; outline: none; }
  #search-input:focus { border-color: #7ec8e3; }

  #poi-list { flex: 1; overflow-y: auto; }
  #poi-list::-webkit-scrollbar { width: 6px; }
  #poi-list::-webkit-scrollbar-track { background: #16213e; }
  #poi-list::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }

  .poi-item { padding: 9px 12px; border-bottom: 1px solid #0f3460; cursor: pointer; transition: background 0.15s; display: flex; align-items: flex-start; gap: 9px; }
  .poi-item:hover { background: #0f3460; }
  .poi-item.active { background: #1a4a8a; border-left: 3px solid #7ec8e3; }
  .poi-item.verified { border-left: 3px solid #e74c3c; }
  .poi-item.verified.active { border-left: 3px solid #ff6b6b; }

  .poi-num { min-width: 24px; height: 24px; border-radius: 50%; background: #0f3460; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #7ec8e3; flex-shrink: 0; }
  .poi-item.verified .poi-num { background: #8b1a1a; color: #ff9999; }

  .poi-info { flex: 1; min-width: 0; }
  .poi-name { font-size: 12px; font-weight: 600; color: #e0e0e0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .poi-coords { font-size: 10px; color: #8a9bb0; margin-top: 2px; font-family: monospace; }
  .poi-coords.edited { color: #7ec8e3; }

  .poi-badge { font-size: 10px; padding: 2px 6px; border-radius: 10px; background: #0a2240; color: #5a9cc5; flex-shrink: 0; margin-top: 2px; white-space: nowrap; }
  .poi-badge.osm { background: #3a0a0a; color: #e74c3c; }
  .poi-badge.moved { background: #0a3020; color: #4ac98a; }

  #footer { padding: 10px 12px; border-top: 1px solid #0f3460; display: flex; flex-direction: column; gap: 7px; }
  #counter { font-size: 11px; color: #8a9bb0; text-align: center; }
  #counter span { color: #4ac98a; font-weight: 700; }
  #osm-counter { font-size: 11px; color: #8a9bb0; text-align: center; }
  #osm-counter span { color: #e74c3c; font-weight: 700; }

  .btn { width: 100%; padding: 9px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
  .btn-export { background: #1a6b45; color: #4ac98a; }
  .btn-export:hover { background: #1d7d50; }
  .btn-copy { background: #1a3a6b; color: #7ec8e3; }
  .btn-copy:hover { background: #1d4580; }
  .btn-reset { background: #3a1a1a; color: #e07070; font-size: 11px; padding: 6px; }
  .btn-reset:hover { background: #4a2020; }

  #map { flex: 1; }

  .leaflet-popup-content-wrapper { background: #16213e; color: #e0e0e0; border: 1px solid #0f3460; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
  .leaflet-popup-tip { background: #16213e; }
  .popup-title { font-weight: 700; font-size: 13px; color: #7ec8e3; margin-bottom: 4px; }
  .popup-title.verified { color: #e74c3c; }
  .popup-id { font-size: 11px; color: #8a9bb0; }
  .popup-coords { font-size: 12px; font-family: monospace; margin-top: 5px; color: #4ac98a; }
  .popup-osm { font-size: 11px; color: #e74c3c; margin-top: 3px; font-weight: 600; }
  .popup-hint { font-size: 11px; color: #8a9bb0; margin-top: 3px; }

  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a6b45; color: #4ac98a; padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 9999; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h1>💧 Редактор источников Осетии</h1>
    <p>Перетащи маркер на карте → координаты обновятся</p>
  </div>

  <div id="legend">
    <div class="leg"><div class="leg-dot leg-red"></div><span class="leg-label">Найдено на OSM-карте</span></div>
    <div class="leg"><div class="leg-dot leg-blue"></div><span class="leg-label">Требует проверки</span></div>
  </div>

  <div id="search-box">
    <input id="search-input" type="text" placeholder="Поиск источника..." oninput="filterList(this.value)">
  </div>

  <div id="poi-list"></div>

  <div id="footer">
    <div id="osm-counter">Найдено на карте: <span id="osm-count">0</span> / 64</div>
    <div id="counter">Вручную изменено: <span id="edited-count">0</span></div>
    <button class="btn btn-export" onclick="exportJSON()">⬇ Скачать updated-springs.json</button>
    <button class="btn btn-copy" onclick="copyJSON()">📋 Скопировать в буфер</button>
    <button class="btn btn-reset" onclick="resetAll()">↺ Сбросить ручные изменения</button>
  </div>
</div>

<div id="map"></div>
<div id="toast">✓ Скопировано!</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

const state = SPRINGS_DATA.map(s => ({ ...s, origLat: s.lat, origLng: s.lng, manualEdited: false }));
const markers = {};
let activeId = null;

const map = L.map('map', { zoomControl: true }).setView([43.0, 44.2], 9);

// Спутниковый слой Esri
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles © Esri',
  maxZoom: 19
}).addTo(map);

// Полупрозрачные подписи поверх спутника
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  opacity: 0.35,
  maxZoom: 19
}).addTo(map);

function makeIcon(s, isActive) {
  const verified = s.verified;
  const size = isActive ? 32 : 24;
  const color = verified ? '#e74c3c' : '#0891b2';
  const border = isActive ? '#fff' : (verified ? '#ff9999' : '#7ec8e3');
  return L.divIcon({
    className: '',
    html: `<div style="
      width:${size}px;height:${size}px;
      background:${color};
      border:2px solid ${border};
      border-radius:50% 50% 50% 0;
      transform:rotate(-45deg);
      box-shadow:0 2px 8px rgba(0,0,0,0.5);
    "></div>`,
    iconSize: [size, size],
    iconAnchor: [size/2, size],
    popupAnchor: [0, -size]
  });
}

function buildList(filter) {
  const list = document.getElementById('poi-list');
  list.innerHTML = '';
  state.forEach((s, i) => {
    if (filter && !s.name.toLowerCase().includes(filter.toLowerCase()) && !s.id.includes(filter.toLowerCase())) return;
    const isManual = s.manualEdited;
    let badgeText = s.verified ? '🔴 OSM' : s.id;
    let badgeClass = s.verified ? 'osm' : '';
    if (isManual) { badgeText = '✓ изменён'; badgeClass = 'moved'; }

    const item = document.createElement('div');
    item.className = 'poi-item' + (s.verified ? ' verified' : '') + (s.id === activeId ? ' active' : '');
    item.dataset.id = s.id;
    item.innerHTML = `
      <div class="poi-num">${i + 1}</div>
      <div class="poi-info">
        <div class="poi-name">${s.name}</div>
        <div class="poi-coords ${isManual ? 'edited' : ''}">${s.lat.toFixed(5)}, ${s.lng.toFixed(5)}</div>
      </div>
      <div class="poi-badge ${badgeClass}">${badgeText}</div>
    `;
    item.onclick = () => focusPOI(s.id);
    list.appendChild(item);
  });
}

function focusPOI(id) {
  activeId = id;
  const s = state.find(x => x.id === id);
  if (!s) return;
  map.setView([s.lat, s.lng], Math.max(map.getZoom(), 14));
  if (markers[id]) {
    markers[id].setIcon(makeIcon(s, true));
    markers[id].openPopup();
  }
  Object.keys(markers).forEach(mid => {
    if (mid !== id) {
      const ms = state.find(x => x.id === mid);
      if (ms) markers[mid].setIcon(makeIcon(ms, false));
    }
  });
  buildList(document.getElementById('search-input').value);
  setTimeout(() => {
    const el = document.querySelector(`.poi-item[data-id="${id}"]`);
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }, 50);
}

function updateCounters() {
  const manual = state.filter(s => s.manualEdited).length;
  const osm = state.filter(s => s.verified).length;
  document.getElementById('edited-count').textContent = manual;
  document.getElementById('osm-count').textContent = osm;
}

state.forEach(s => {
  const marker = L.marker([s.lat, s.lng], {
    draggable: true,
    icon: makeIcon(s, false),
    title: s.name
  }).addTo(map);

  const osmLine = s.verified ? `<div class="popup-osm">✓ Найдено на OSM: ${s.osmNote}</div>` : '';
  marker.bindPopup(`
    <div class="popup-title ${s.verified ? 'verified' : ''}">${s.name}</div>
    <div class="popup-id">${s.id}</div>
    <div class="popup-coords" id="pcoords-${s.id}">${s.lat.toFixed(5)}, ${s.lng.toFixed(5)}</div>
    ${osmLine}
    <div class="popup-hint">Перетащи маркер для изменения позиции</div>
  `);

  marker.on('dragend', function(e) {
    const { lat, lng } = e.target.getLatLng();
    s.lat = parseFloat(lat.toFixed(6));
    s.lng = parseFloat(lng.toFixed(6));
    s.manualEdited = true;
    const el = document.getElementById(`pcoords-${s.id}`);
    if (el) el.textContent = `${s.lat.toFixed(5)}, ${s.lng.toFixed(5)}`;
    buildList(document.getElementById('search-input').value);
    updateCounters();
  });

  marker.on('click', () => focusPOI(s.id));
  markers[s.id] = marker;
});

function filterList(val) { buildList(val); }

function exportJSON() {
  const output = state.map(s => ({ id: s.id, lat: s.lat, lng: s.lng, verified: s.verified || s.manualEdited }));
  const blob = new Blob([JSON.stringify(output, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'updated-springs.json';
  a.click();
}

function copyJSON() {
  const output = state.map(s => ({ id: s.id, lat: s.lat, lng: s.lng }));
  navigator.clipboard.writeText(JSON.stringify(output, null, 2)).then(() => {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  });
}

function resetAll() {
  if (!confirm('Сбросить все ручные изменения? OSM-координаты сохранятся.')) return;
  state.forEach(s => {
    if (s.manualEdited) {
      s.lat = s.origLat; s.lng = s.origLng; s.manualEdited = false;
      markers[s.id].setLatLng([s.lat, s.lng]);
    }
  });
  buildList('');
  updateCounters();
}

buildList('');
updateCounters();
</script>
</body>
</html>
